<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fff7fb">
  <title>Convite da Luna</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="convite">

    <!-- 0. ASSINATURA DA MARCA -->
    <section id="tela-logo" class="tela tela-logo ativa" aria-hidden="false">
      <div class="assinatura">
        <img src="imagens/logo-marca.png" alt="Cassia Guimarães Social Media para Eventos">
      </div>
    </section>

    <!-- 1. ARTE INICIAL: a própria arte é o botão -->
    <section id="tela-inicial" class="tela tela-inicial" aria-hidden="true">
      <button id="abrir-convite" class="botao-inicial" type="button" aria-label="Abrir o convite">
        <img src="imagens/tela-inicial.png" alt="Clique no envelope para abrir o convite">
      </button>
    </section>

    <!-- 2. VÍDEO DE ABERTURA -->
    <section id="tela-video" class="tela tela-video" aria-hidden="true">
      <video id="video-abertura" class="video-abertura"
             src="imagens/abertura.mp4"
             preload="auto" playsinline></video>
    </section>

    <!-- 3. CONVITE FINAL -->
    <section id="tela-convite" class="tela tela-final" aria-hidden="true">
      <div class="borboletas-gif" aria-hidden="true">
        <img class="bg1" src="imagens/borboleta.gif" alt="">
        <img class="bg2" src="imagens/borboleta.gif" alt="">
        <img class="bg3" src="imagens/borboleta.gif" alt="">
        <img class="bg4" src="imagens/borboleta.gif" alt="">
        <img class="bg5" src="imagens/borboleta.gif" alt="">
        <img class="bg6" src="imagens/borboleta.gif" alt="">
      </div>
      <img src="imagens/convite-luna.png" alt="Convite de 1 ano da Luna">

      <div class="acoes">
        <button class="acao" id="btn-local" type="button">
          <span class="icone">⌖</span>
          <span>Local</span>
        </button>

        <button class="acao" id="btn-confirmar" type="button">
          <span class="icone">✓</span>
          <span>Confirmar</span>
        </button>
      </div>

      <div id="contador" class="contador" aria-label="Contagem regressiva">
        <span id="contador-tempo">-- dias • --h • --min • --s</span>
      </div>
    </section>

    <button id="controle-musica" class="controle-musica" type="button"
            aria-label="Pausar música">♫</button>

    <div id="modal-confirmacao" class="modal-overlay" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="titulo-confirmacao">
        <button id="fechar-modal" class="fechar-modal" type="button" aria-label="Fechar">×</button>
        <div class="modal-flor">✦</div>
        <h2 id="titulo-confirmacao">Confirmação de presença</h2>
        <p>Será uma alegria ter você com a gente nesse dia tão especial.</p>
        <div class="opcoes">
          <button id="vai-sim" type="button">Sim, estarei presente</button>
          <button id="vai-nao" type="button">Não poderei comparecer</button>
        </div>
      </div>
    </div>

    <audio id="musica" preload="auto" loop>
      <source src="imagens/musica.mp3" type="audio/mpeg">
    </audio>
  </main>

  <script src="script.js"></script>
</body>
</html>
